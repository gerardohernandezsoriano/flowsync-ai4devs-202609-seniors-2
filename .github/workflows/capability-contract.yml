name: Contrato de capability

on:
  pull_request:
  push:
    branches: [main]

# Solo leer el repo: ni comentarios, ni estados, ni escritura.
permissions:
  contents: read

jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo para recorrer el rango commit a commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Comprobar .adonisjs/ y README de capability
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            range=""  # rama nueva: no hay "antes" contra el que comparar
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          ../scripts/check-capability-contract.sh $range
