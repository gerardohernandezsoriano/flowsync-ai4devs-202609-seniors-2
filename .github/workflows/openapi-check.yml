name: Contrato OpenAPI

on:
  pull_request:
  push:
    branches: [main]

# Solo leer el repo: ni comentarios, ni estados, ni escritura.
permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # La app valida el entorno al arrancar y necesita APP_KEY. La clave es
      # desechable: este job no sirve ni firma nada.
      - name: Preparar entorno
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Comprobar que docs/api/openapi.json coincide con el código
        run: npm run openapi:check
